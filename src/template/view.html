<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Timeline · @thecause/timelinejs</title>
    <meta charset="utf-8">
    <meta name="description" content="Viewer plein écran @thecause/timelinejs.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta property="og:title" content="Timeline · @thecause/timelinejs">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#15130e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/timeline.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            padding: 0;
            margin: 0;
            background: #15130e;
            overflow: hidden;
            font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
        }
        #timeline-view {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #fatal-error {
            position: fixed; inset: 0; display: none;
            align-items: center; justify-content: center;
            color: rgba(239,232,216,.85);
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            padding: 32px;
            text-align: center;
        }
        #fatal-error.on { display: flex; }
        #fatal-error a { color: oklch(70% 0.16 198); }
        #fatal-error code { color: rgba(239,232,216,.6); }

        /* Discreet "back to landing" logo, top-left overlay. */
        .home-link {
            position: fixed;
            top: 12px; left: 12px;
            z-index: 99999;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 12px 7px 10px;
            background: rgba(10,10,12,.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            text-decoration: none;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(239,232,216,.78);
            opacity: 0.7;
            transition: opacity .18s, color .18s, border-color .18s, background .18s;
        }
        .home-link:hover, .home-link:focus-visible {
            opacity: 1;
            color: #efe8d8;
            background: rgba(10,10,12,.9);
            border-color: rgba(255,255,255,.28);
        }
        .home-mark { display: inline-flex; gap: 3px; align-items: center; }
        .home-mark i {
            width: 4px; height: 4px; border-radius: 50%; display: inline-block;
        }
        .home-mark i:nth-child(1) { background: oklch(70% 0.16 198); }
        .home-mark i:nth-child(2) { background: #efe8d8; }
        .home-mark i:nth-child(3) { background: oklch(72% 0.15 60); }
        @media (max-width: 480px) {
            .home-label { display: none; }
            .home-link { padding: 8px; }
        }
        /* Reserve room for the home-link so skin top bars don't sit under it. */
        #timeline-view .tl-topbar { padding-left: 132px !important; }
        @media (max-width: 480px) {
            #timeline-view .tl-topbar { padding-left: 52px !important; }
        }
    </style>
</head>

<body>
    <a class="home-link" href="./" aria-label="Retour à l'accueil" title="Retour à l'accueil">
        <span class="home-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="home-label">accueil</span>
    </a>
    <div id="timeline-view"></div>
    <div id="fatal-error" role="alert"></div>

    <script type="text/javascript">
        function ready(fn) {
            if (document.readyState !== 'loading') fn();
            else document.addEventListener('DOMContentLoaded', fn);
        }

        function optionsFromUrlParams() {
            var qs = new URLSearchParams(window.location.search);
            var out = {};
            qs.forEach(function (v, k) { out[k] = v; });
            return out;
        }

        function setPageLanguage(lang) {
            if (lang) document.documentElement.setAttribute('lang', lang);
        }

        function stripTags(s) { return String(s || '').replace(/<[^>]*>/g, '').trim(); }

        var BASE_TITLE = document.title;
        function applyDocumentTitle(headline) {
            var h = stripTags(headline);
            if (h) document.title = h + ' · @thecause/timelinejs';
        }

        // Pick bundle based on ?theme=. React skin if any theme given.
        function loadTimelineBundle(useReact) {
            return new Promise(function (resolve, reject) {
                var s = document.createElement('script');
                s.id = 'timeline-script-tag';
                s.src = useReact ? 'js/timeline.react.js' : 'js/timeline.js';
                s.onload = function () {
                    var abs = new URL(s.src, window.location.href).toString();
                    resolve(abs.substr(0, abs.lastIndexOf('/') + 1));
                };
                s.onerror = function () { reject(new Error('Failed to load ' + s.src)); };
                document.head.appendChild(s);
            });
        }

        // Render fatal-error message using DOM nodes only (no innerHTML).
        function fatal(message, hint) {
            var el = document.getElementById('fatal-error');
            while (el.firstChild) el.removeChild(el.firstChild);
            var wrap = document.createElement('div');
            var msg = document.createElement('p');
            msg.textContent = message;
            msg.style.marginBottom = '12px';
            wrap.appendChild(msg);
            if (hint) wrap.appendChild(hint);
            el.appendChild(wrap);
            el.classList.add('on');
        }

        function buildMissingSourceHint() {
            var hint = document.createElement('p');
            hint.style.opacity = '0.7';
            hint.appendChild(document.createTextNode('Ajoutez '));
            var code = document.createElement('code');
            code.textContent = '?source=<URL_JSON>';
            hint.appendChild(code);
            hint.appendChild(document.createTextNode(' à l’URL ou utilisez la '));
            var link = document.createElement('a');
            link.href = './';
            link.textContent = 'landing';
            hint.appendChild(link);
            hint.appendChild(document.createTextNode('.'));
            return hint;
        }

        ready(function () {
            var options = optionsFromUrlParams();
            setPageLanguage(options.lang || options.language);

            // Coerce common video-recording options from URL strings to real values
            // so the cinematic skin reads them correctly.
            if (options.autoplay === 'true' || options.autoplay === '1') options.autoplay = true;
            if (options.loop === 'false' || options.loop === '0') options.loop = false;
            if (options.cinematicDuration) {
                var d = parseInt(options.cinematicDuration, 10);
                if (Number.isFinite(d) && d > 0) options.cinematicDuration = d;
            }

            // chrome=hidden: hide every viewer affordance, including the home-link
            // overlay so recordings show only the skin content.
            if (options.chrome === 'hidden') {
                var home = document.querySelector('.home-link');
                if (home) home.style.display = 'none';
            }

            if (!options.source) {
                fatal('Aucune source fournie.', buildMissingSourceHint());
                return;
            }

            // Defaults that make sense for a standalone viewer (vs an iframe):
            //  - standalone=true so the React skins use URL-hash routing.
            //  - container fills the viewport, no iframe gymnastics.
            options.standalone = options.standalone !== 'false';

            loadTimelineBundle(!!options.theme)
                .then(function (script_path) {
                    options.script_path = options.script_path || script_path;
                    var TL = window.TL;
                    if (!TL) { fatal('Bundle TimelineJS introuvable.'); return; }

                    try {
                        if (options.theme && TL.TimelineReact) {
                            var userOnReady = typeof options.onReady === 'function' ? options.onReady : null;
                            options.onReady = function (data) {
                                applyDocumentTitle(data && data.title && data.title.headline);
                                if (userOnReady) userOnReady(data);
                            };
                            window.timeline = new TL.TimelineReact('timeline-view', options.source, options);
                        } else {
                            window.timeline = new TL.Timeline('timeline-view', options.source, options);
                            if (window.timeline && typeof window.timeline.on === 'function') {
                                window.timeline.on('ready', function () {
                                    var cfg = window.timeline.config;
                                    var headline = cfg && cfg.title && cfg.title.text && cfg.title.text.headline;
                                    applyDocumentTitle(headline);
                                });
                            }
                        }
                    } catch (e) {
                        fatal('Erreur d’instanciation : ' + (e && e.message ? e.message : String(e)));
                    }
                })
                .catch(function (e) {
                    fatal('Impossible de charger le bundle : ' + (e && e.message ? e.message : String(e)));
                });
        });
    </script>
</body>
</html>
